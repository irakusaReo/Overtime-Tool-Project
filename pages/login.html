<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Login · CX Intranet Overtime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="auth">
<svg class="auth__bg" viewBox="0 0 1440 960" preserveAspectRatio="none" aria-hidden="true"><rect width="1440" height="960" fill="#FAFAFA"/><polygon points="0,0 520,0 210,390" fill="#F5F5F5"/><polygon points="0,560 210,390 470,520 0,960" fill="#F3F3F3"/><polygon points="210,390 520,0 760,0 470,520" fill="#FCFCFC"/><polygon points="960,0 1440,0 1440,280 1180,330" fill="#F4F4F4"/><polygon points="1180,330 1440,280 1440,700" fill="#FBFBFB"/><polygon points="980,620 1440,700 1440,960 900,960" fill="#F2F2F2"/><polygon points="470,520 980,620 900,960 260,960" fill="#F7F7F7"/></svg>
  <div class="auth__card">
    <div class="auth__body">
      <img src="../assets/safaricom-logo.png" alt="Safaricom" width="185" height="42" style="width:185px;height:42px">
      <div class="stack stack--2">
        <h1 class="page-title">Welcome back!</h1>
        <p style="font-size:16px;line-height:24px;color:var(--color-text-heading)">Sign In to continue</p>
      </div>
      <form class="stack stack--8" action="cee-dashboard.html">
        <div class="field"><label class="field__label">Email</label><div class="input"><span class="input__placeholder">Enter Email</span></div></div>
        <a class="btn btn--primary btn--lg btn--block" href="landing.html">Proceed</a>
      </form>
      <div class="auth__divider"><span class="auth__divider-line"></span><span>or continue with</span><span class="auth__divider-line"></span></div>
      <a class="btn btn--secondary btn--lg btn--block" href="landing.html" style="border-color:var(--color-text-body);box-shadow:none;gap:16px;font-size:18px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="14" height="14" fill="#F25325"/><rect x="17" y="1" width="14" height="14" fill="#80BC06"/><rect x="1" y="17" width="14" height="14" fill="#05A6F0"/><rect x="17" y="17" width="14" height="14" fill="#FEBA08"/></svg>Azure</a>
    </div>
    <div class="auth__footer">By signing in you agree to our <a href="#">Terms &amp; Conditions</a> &amp; <a href="#">Privacy Policy</a></div>
  </div>
</div>
</body>
</html>
